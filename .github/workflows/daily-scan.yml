name: daily scan

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run market scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python metaharness/registry/research_update.py

      - name: Commit scan output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metaharness/registry/INBOX.md metaharness/registry/registry.json
          git diff --staged --quiet || git commit -m "chore(scan): daily market scan $(date -u +%Y-%m-%d)"
          git push
